# The one CI entry point. Each check is a reusable workflow called as a job here, and is
# skipped when none of its inputs changed (see scripts/ci/changed-checks.cjs).
# `npm run verify` is for agents working locally; CI doesn't call it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typecheck: ${{ steps.checks.outputs.typecheck }}
      skills: ${{ steps.checks.outputs.skills }}
      build: ${{ steps.checks.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: checks
        run: npm run ci:changes -- ${{ github.event.pull_request.base.sha || github.event.before }} ${{ github.sha }}

  # Each check is skipped only when `changes` succeeded and said it isn't needed; if `changes`
  # fails, its outputs are empty and the check runs. `!cancelled()` stops a failed `changes`
  # from skipping it.
  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typecheck != 'false' }}
    uses: ./.github/workflows/typecheck.yml

  skills:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skills != 'false' }}
    uses: ./.github/workflows/skills.yml

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    uses: ./.github/workflows/build.yml

  # Every push and pull request brings commits to lint, so this always runs.
  commitlint:
    uses: ./.github/workflows/commitlint.yml
